<!DOCTYPE html>
<html>
<head>
    <title>What Should I Wear?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="page">

    <h1>What Should I Wear Today?</h1>
    <p>Type today's temperature and I'll pick an outfit for you.</p>

    <input type="number" id="tempInput" placeholder="Temperature in °C">
    <br>
    <label>
        <input type="checkbox" id="rainBox"> Is it raining?
    </label>
    <br>
    <button id="checkBtn">What should I wear?</button>

    <h2 id="outfit">Your outfit will show here</h2>
    <p id="extra"></p>
    <p id="count">Checks so far: 0</p>

    <script src="script.js"></script>
</body>
</html>
